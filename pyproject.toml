[project]
name = "memrelay-workspace"
version = "0.0.0"
requires-python = ">=3.11"
description = "MemRelay monorepo root (not published)"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/sync"]

[tool.uv.sources]
memrelay = { workspace = true }
memrelay-sync = { workspace = true }

[dependency-groups]
dev = ["memrelay", "memrelay-sync", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/sync/tests"]
asyncio_mode = "auto"
markers = ["integration: needs the basic-memory executable on PATH"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["memrelay", "memrelay_sync"]
