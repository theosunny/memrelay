# Unsigned macOS .dmg and .app zip. Do not set APPLE_SIGNING_IDENTITY to an empty
# string: an empty env var overrides the null signingIdentity in tauri.conf.json.
name: release-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build unsigned app and dmg
        working-directory: packages/desktop
        run: |
          npm ci
          npm run tauri build
      - name: Zip the .app
        working-directory: packages/desktop
        run: |
          version=$(node -p "require('./package.json').version")
          ditto -c -k --keepParent \
            "src-tauri/target/release/bundle/macos/忆桥分身.app" \
            "src-tauri/target/release/bundle/macos/memrelay-${version}.app.zip"
          cp src-tauri/target/release/bundle/dmg/*.dmg \
            "src-tauri/target/release/bundle/dmg/memrelay-${version}-aarch64.dmg"
          echo "MEMRELAY_DMG=packages/desktop/src-tauri/target/release/bundle/dmg/memrelay-${version}-aarch64.dmg" >> "$GITHUB_ENV"
          echo "MEMRELAY_ZIP=packages/desktop/src-tauri/target/release/bundle/macos/memrelay-${version}.app.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: |
            ${{ env.MEMRELAY_DMG }}
            ${{ env.MEMRELAY_ZIP }}
          if-no-files-found: error
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # A hyphen tag is still the latest release. The live site reads
          # /releases/latest, which skips GitHub prereleases.
          prerelease: false
          body: |
            Unsigned macOS build of 忆桥分身. Gatekeeper will warn the first time: right-click the app and choose Open.
            No Apple notarization.
          files: |
            ${{ env.MEMRELAY_DMG }}
            ${{ env.MEMRELAY_ZIP }}
