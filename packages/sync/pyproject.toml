[project]
name = "memrelay-sync"
version = "0.1.0"
description = "Zero-knowledge ciphertext store for MemRelay vault sync"
readme = "protocol.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.scripts]
memrelay-sync = "memrelay_sync.app:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrelay_sync"]
