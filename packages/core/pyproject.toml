[project]
name = "memrelay"
version = "0.2.0.dev0"
description = "MemRelay (忆桥): one reviewed, provenance-tracked personal memory shared by all your AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "The MemRelay Authors" }]
dependencies = [
  "fastmcp>=4.1,<5",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "platformdirs>=4",
  "httpx>=0.27",
  "watchfiles>=0.22",
  "tomlkit>=0.12",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.scripts]
memrelay = "memrelay.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memrelay"]
