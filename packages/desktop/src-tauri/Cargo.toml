[package]
name = "memrelay-shell"
version = "0.2.0"
description = "忆桥分身 desktop shell"
authors = ["The MemRelay Authors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "memrelay_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
